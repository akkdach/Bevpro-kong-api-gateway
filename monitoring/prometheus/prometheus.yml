# Prometheus config — scrape Kong Gateway metrics
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Kong Gateway — Prometheus plugin exposes /metrics on the status listener (:8100)
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong-gateway:8100"]

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
