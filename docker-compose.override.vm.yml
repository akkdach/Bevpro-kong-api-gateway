# ═══════════════════════════════════════════════════════════════
# Override สำหรับ Azure VM "WebApplication-kong-gateway" (Standard_B2ls_v2 — 2 vCPU / 3.8GB RAM)
# ไฟล์นี้ถูก deploy อยู่ที่: /home/adminwebapp/kong/docker-compose.override.yml (ชื่อบน VM ไม่มี .vm)
# docker compose จะรวมไฟล์ชื่อ docker-compose.override.yml กับ docker-compose.yml ให้อัตโนมัติ
# ถ้าแก้ไฟล์นี้ ให้ copy ขึ้น VM แล้วรัน: docker compose up -d
# ═══════════════════════════════════════════════════════════════
services:
  kong:
    # ทั้ง 3 ชื่อนี้คือเครื่อง IIS ตัวเดียวกัน (public 20.33.118.76 = private 10.0.0.4 ใน VNet)
    # override ให้ Kong resolve เป็น private IP -> upstream ทุกเส้นที่ชี้เครื่องนี้วิ่งภายใน VNet
    # (bevpro-prod/uat/service, material-images, iot-service, inbound-mobile)
    # ไม่ออก public โดยที่ SNI/hostname ยังถูกต้อง (binding IIS บังคับชื่อ ยิงด้วย IP โดน 400)
    # วัดจริง 2026-09-01: private เร็วกว่า public ~17ms/req และตัด DNS lookup 31-206ms
    # ถ้าเครื่อง IIS เปลี่ยน private IP ต้องแก้ทั้ง 3 บรรทัดตาม
    extra_hosts:
      - "soap.bevproasia.com:10.0.0.4"
      - "service.bevproasia.com:10.0.0.4"
      - "iotservice.bevproasia.com:10.0.0.4"
    environment:
      KONG_NGINX_WORKER_PROCESSES: "2"   # fix เท่าจำนวน core (กัน resize VM แล้ว auto เปิด worker เพิ่มจนกิน RAM)
      KONG_MEM_CACHE_SIZE: "128m"
    deploy:
      resources:
        limits:
          memory: 1G

  kong-database:
    command: postgres -c shared_buffers=256MB -c effective_cache_size=512MB
    deploy:
      resources:
        limits:
          memory: 768M

  konga:
    deploy:
      resources:
        limits:
          memory: 384M

  log-receiver:
    environment:
      NODE_OPTIONS: "--max-old-space-size=128"
    deploy:
      resources:
        limits:
          memory: 192M

  prometheus:
    # external-url = ลิงก์ในหน้าเว็บชี้ผ่าน Kong /prometheus (HTTPS)
    # route-prefix=/ = ตัวโปรแกรมยังเสิร์ฟที่ root -> Grafana datasource ภายใน (http://prometheus:9090) ไม่พัง
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=2GB"   # กันดิสก์เต็ม — อันไหนถึงก่อนใช้อันนั้น
      - "--web.external-url=https://bevprogateway.southeastasia.cloudapp.azure.com/prometheus"
      - "--web.route-prefix=/"
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    # เสิร์ฟผ่าน Kong ที่ path /grafana -> ได้ HTTPS จากใบรับรวมของ gateway
    # (route ฝั่ง Kong ชื่อ grafana-admin จำกัด IP แอดมินด้วย ip-restriction)
    environment:
      GF_SERVER_ROOT_URL: "https://bevprogateway.southeastasia.cloudapp.azure.com/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # datasource SqlServerBevPro — อ่าน DMV ของ SQL Server ที่ backend (10.0.0.4 ใน VNet)
      # ใช้ private IP ไม่ใช่ public เพื่อไม่ให้ traffic ออกอินเทอร์เน็ต
      # login read-only เท่านั้น สร้างด้วย scripts/create-grafana-sql-login.sql
      # รหัสอยู่ใน .env key ชื่อ MSSQL_GRAFANA_PASSWORD (ถ้าว่าง datasource จะต่อไม่ติด)
      MSSQL_GRAFANA_HOST: ${MSSQL_GRAFANA_HOST:-10.0.0.4:1433}
      MSSQL_GRAFANA_DB: ${MSSQL_GRAFANA_DB:-BevproFsProd}
      MSSQL_GRAFANA_USER: ${MSSQL_GRAFANA_USER:-grafana_reader}
      MSSQL_GRAFANA_PASSWORD: ${MSSQL_GRAFANA_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 384M

  # ─────────────────────────────────────────────
  # 🔌 pg-bridge — เปิดพอร์ต 5432 ให้ pgAdmin ต่อจากออฟฟิศ (NSG กรอง IP แล้ว)
  # เดิมเป็น container เดี่ยวนอก compose -> ขวาง docker compose down
  # ("network has active endpoints") ย้ายเข้า compose เพื่อให้รื้อ-ตั้งพร้อมกัน
  # ก่อน up ครั้งแรก ต้องลบตัวเดี่ยวเก่าก่อน: docker rm -f pg-bridge
  # ─────────────────────────────────────────────
  pg-bridge:
    image: alpine/socat
    container_name: pg-bridge
    restart: unless-stopped
    command: tcp-listen:5432,fork,reuseaddr tcp:kong-database:5432
    ports:
      - "5432:5432"
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - kong-net
    deploy:
      resources:
        limits:
          memory: 64M
